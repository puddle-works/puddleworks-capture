# Create the Slack app from this: api.slack.com/apps → Create New App → From
# a manifest. Socket Mode means it needs no public URL.
display_information:
  name: Capture
  description: Discuss and agree Capture requests, one thread each.
features:
  bot_user:
    display_name: Capture
    always_online: true
  slash_commands:
    - command: /capture
      description: Raise a request, or see your steps on one (/capture 12)
      usage_hint: "[request number]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      # Posts a stand-in agent's messages under its own name.
      - chat:write.customize
      # Reads replies in request threads, in a public or a private channel.
      - channels:history
      - groups:history
      # Matches each person to Capture's people list by email.
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
