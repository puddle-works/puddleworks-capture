manifestVersion: 1
name: "@puddleworks/capture"
version: "2026.11.10.1"
description: |
  Capture turns what someone asks for into an agreed outcome spec. A request
  is raised as a draft, discussed by its outcome owner and builders, given a
  specification, reviewed and agreed. Agreeing writes it as outcome-spec/v1
  JSON for the builder; it can be exported again as JSON or Markdown. Every
  specification has a recipe: the phrases it must answer and
  what each answer shows, and it can say whether the outcome only reads or
  changes things. A build-result/v1 from the factory moves the request to
  Building, and to Released once it is published and one recipe answered
  every example through puddlerouter with that version; a builder can mark
  it Building earlier, when work starts (an outcome owner who is a
  builder can too). An agreed spec can be revised and
  proposed again in one step, with a reason. Everything is kept in swamp
  data.

  ## Models

  - `@puddleworks/capture/requests`: the people list and every request, with
    a method for each step: create_request (safe to retry with an
    idempotency key), submit, invite, join_request, post_message,
    edit_specification, propose, revise_specification, record_review, agree,
    export_outcome_spec, start_building, record_build_result,
    transfer_ownership and more. Each request has a number (#1, #2, …) that methods take in
    place of its id. Each change says who is acting with `as`, and Capture's
    rules decide what they may do.
  - `@puddleworks/capture/web`: a read-only page on 127.0.0.1 showing every
    request and the people list, reloaded as the data changes.

  ## Workflows

  - `@puddleworks/capture-log-request`: log a request as a draft from
    another tool, such as puddlerouter, keyed on where it came from, and
    owned by the person who asked (`requester`). A phrase it was asked as
    starts the draft spec's recipe, and stays its first example.
  - `@puddleworks/capture-review-spec`: have an agent review the
    specification up for agreement; its findings become questions the outcome
    owner must settle before agreeing. Bring your own agent behavior, such as
    `@mgreten/cli-agent`.
repository: "https://github.com/puddle-works/puddleworks-capture"
