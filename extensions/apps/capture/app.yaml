name: "@puddleworks/capture"
title: "Capture"
entry: dist/index.html
bridge: 1
platform: "1.4"
# The app reads Capture's requests and people with data.query and hears of
# changes with data.subscribe. It takes steps only by running the
# @puddleworks/capture-app-step workflow, which acts as the person serve
# says started the run, by their swamp login in the people list. It runs no
# method itself.
capabilities: [data:read]
run: ["@puddleworks/capture-app-step"]
methods: []
