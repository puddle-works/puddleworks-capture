id: 7c1d2e9a-4b6f-4e38-a0d5-3f9b8c2e6a14
name: "@puddleworks/capture-app-step"
description: >-
  Take one of the Capture app's steps as the person signed in to swamp serve.
  The person is the run's own login (run.initiatedBy), matched to the people
  list by add_person or update_person principal=user:…; no input names
  who acts, and anyone not on the list is refused. The Capture app may run
  only this workflow. When one person holds both roles, a stand-in agent's
  turn follows, as in the Slack app (app_stand_in decides; set standInAgent
  on the behavior). Needs a @puddleworks/capture/requests behavior named
  capture.
version: 1
tags:
  # As capture-stand-in's: a stand-in's turn after the step can take minutes.
  # Swamp doesn't stop a run at it; serve's --max-run-duration does.
  maxWallClock: "30m"
inputs:
  type: object
  properties:
    step:
      type: string
      enum:
        - whoami
        - raise
        - reply
        - submit
        - propose
        - agree
        - requestChanges
        - withdraw
        - join
        - editSpecification
        - recordBuildResult
        - resolveQuestion
      description: The step to take; whoami only says who the login is.
    id:
      type: string
      description: The request's id; blank for whoami and raise.
      default: ""
    nonce:
      type: string
      description: whoami only; names the signed-in-<nonce> data it writes.
      default: ""
    version:
      type: integer
      description: agree only; the specification version shown.
      default: 0
    note:
      type: string
      default: ""
    reason:
      type: string
      default: ""
    body:
      type: string
      default: ""
    questionId:
      type: string
      default: ""
    result:
      type: string
      description: recordBuildResult only; its JSON or https URL.
      default: ""
    specification:
      type: string
      description: editSpecification only; as JSON text.
      default: ""
    title:
      type: string
      default: ""
    description:
      type: string
      default: ""
    currentProcess:
      type: string
      default: ""
    phrase:
      type: string
      default: ""
    idempotencyKey:
      type: string
      default: ""
  required: [step]
jobs:
  - name: main
    steps:
      - name: step
        description: Take the step as the signed-in person
        task:
          type: model_method
          modelIdOrName: capture
          methodName: app_step
          inputs:
            principal: ${{ run.initiatedBy }}
            step: ${{ inputs.step }}
            id: ${{ inputs.id }}
            nonce: ${{ inputs.nonce }}
            version: ${{ inputs.version }}
            note: ${{ inputs.note }}
            reason: ${{ inputs.reason }}
            body: ${{ inputs.body }}
            questionId: ${{ inputs.questionId }}
            result: ${{ inputs.result }}
            specification: ${{ inputs.specification }}
            title: ${{ inputs.title }}
            description: ${{ inputs.description }}
            currentProcess: ${{ inputs.currentProcess }}
            phrase: ${{ inputs.phrase }}
            idempotencyKey: ${{ inputs.idempotencyKey }}
      - name: next
        description: Whether a stand-in agent's turn follows, as in Slack
        dependsOn:
          - step: step
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: capture
          methodName: app_stand_in
          inputs:
            principal: ${{ run.initiatedBy }}
            step: ${{ inputs.step }}
            id: ${{ inputs.id }}
      - name: stand_in
        description: The stand-in agent takes its turn
        dependsOn:
          - step: next
            condition:
              type: succeeded
        guard: ${{ !steps.next.outputs.due }}
        task:
          type: workflow
          workflowIdOrName: "@puddleworks/capture-stand-in"
          inputs:
            id: ${{ steps.next.outputs.id }}
            agent: ${{ steps.next.outputs.agent }}
            standInAs: ${{ steps.next.outputs.standInAs }}
            point: ${{ steps.next.outputs.point }}
      - name: release
        description: Free the request for the next stand-in turn, however this one ended
        # However the turn ended, but only once next said it was due: a step
        # that failed leaves next without outputs.
        dependsOn:
          - step: next
            condition:
              type: succeeded
          - step: stand_in
            condition:
              type: always
        guard: ${{ !steps.next.outputs.due }}
        task:
          type: model_method
          modelIdOrName: capture
          methodName: app_stand_in_done
          inputs:
            principal: ${{ run.initiatedBy }}
            id: ${{ steps.next.outputs.id }}
            lock: ${{ steps.next.outputs.lock }}
