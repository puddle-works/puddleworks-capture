name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Format
        run: deno fmt --check

  # The swamp extension (ADR-003): its behaviors, domain rules and page.
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Typecheck
        run: deno check --frozen extensions/models/ web/ tests/

      - name: Lint
        run: deno lint extensions/models/ web/ tests/

      # Includes the check that the bundled page matches web/src.
      - name: Test
        run: deno test --frozen --allow-read --allow-write --allow-net=127.0.0.1 extensions/models/ web/ tests/
